<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO básico: ayuda a que buscadores como Google
         muestren bien la página en los resultados -->
    <title>Carlos Destrades — Portafolio | Desarrollador web y móvil</title>
    <meta
      name="description"
      content="Portafolio de Carlos Destrades, estudiante de Ingeniería en Ciencias Informáticas en la UCI (Cuba). Desarrollo web con JavaScript y React, APIs con Python y FastAPI, y apps Android con Kotlin y Jetpack Compose. Busco trabajo remoto de programación."
    />
    <meta
      name="keywords"
      content="Carlos Destrades, portafolio, desarrollador web, React, JavaScript, Python, FastAPI, Kotlin, Jetpack Compose, C++, UCI, Cuba, trabajo remoto, junior developer"
    />
    <meta name="author" content="Carlos Destrades" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b5cad" />

    <!-- Open Graph: cómo se ve el enlace al compartirlo
         en WhatsApp, Facebook, LinkedIn, etc. -->
    <meta property="og:title" content="Carlos Destrades — Portafolio | Desarrollador web y móvil" />
    <meta
      property="og:description"
      content="Estudiante de Ingeniería en Ciencias Informáticas en la UCI. Proyectos en React, Python/FastAPI, C++ y Android con Kotlin. Busco trabajo remoto de programación."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Tarjeta de Twitter/X (usa las mismas ideas de Open Graph) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Carlos Destrades — Portafolio" />
    <meta
      name="twitter:description"
      content="Desarrollador web y móvil en formación: React, Python, C++ y Kotlin. Estudiante de la UCI, Cuba."
    />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b5cad'/%3E%3Ctext x='50' y='68' font-size='52' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3ECD%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- Vite/React monta la aplicación dentro de este div -->

  </body>
</html>
